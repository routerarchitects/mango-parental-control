openapi: 3.0.3
info:
  title: Mango Parental Control Service API
  version: 1.0.0
  description: Internal API contract for Mango Parental Control Service. The service intentionally standardizes successful create, update, and delete operations on `200 OK`.
servers:
  - url: "https://{host}:{publicPort}"
    description: "Public HTTPS API Interface"
    variables:
      host:
        default: "localhost"
        description: "Hostname/IP of the public service"
      publicPort:
        default: "16008"
        description: "Public API interface port"
  - url: "https://{host}:{privatePort}"
    description: "Private/Internal HTTPS API Interface"
    variables:
      host:
        default: "localhost"
        description: "Hostname/IP of the private service"
      privatePort:
        default: "17008"
        description: "Private management/diagnostics port"
security:
  - PublicTokenAuth: []
  - PrivateInternalNameAuth: []
    PrivateApiKeyAuth: []
paths:
  /livez:
    get:
      summary: "Liveness probe"
      description: "Checks if the service is running and healthy. This route is unauthenticated and accessible on both the public and private ports."
      security: []
      responses:
        "200":
          description: "Service is healthy and running"
        "500":
          description: "Service is unhealthy"

  /api/v1/system:
    get:
      summary: "Retrieve system diagnostics and metrics"
      description: "Returns system status info or resource usage based on the requested command."
      security:
        - PrivateInternalNameAuth: []
          PrivateApiKeyAuth: []
      parameters:
        - name: "command"
          in: "query"
          required: true
          schema:
            type: "string"
            enum: ["info", "resources"]
      responses:
        "200":
          description: "Successful query execution"
        "400":
          description: "Invalid command query"
    post:
      summary: "Modify log levels or query diagnostics schema"
      description: "Dynamically mutate runtime subsystem log levels or fetch subsystem metadata."
      security:
        - PrivateInternalNameAuth: []
          PrivateApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
              - "command"
              properties:
                command:
                  type: "string"
                  enum: ["setloglevel", "getloglevels", "getloglevelnames", "getsubsystemnames"]
                subsystems:
                  type: "array"
                  items:
                    type: "object"
                    required:
                    - "tag"
                    - "value"
                    properties:
                      tag:
                        type: "string"
                      value:
                        type: "string"
      responses:
        "200":
          description: "Successful action execution"
        "400":
          description: "Invalid command or malformed body"

  /api/v1/subscribers/{subscriber_id}/groups:
    get:
      summary: List groups
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
      responses:
        '200':
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupListItem'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/StorageFailure' }
    post:
      summary: Create group
      description: Create a new group. Maximum of 20 groups allowed per subscriber. Exceeding this limit returns a 409 Conflict error. The response always contains the `config-raw` field, which will be `null` for no-op changes or populated if the effective policy state changes. Group creation stores group metadata only and does not create active device-side enforcement.
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreateRequest'
      responses:
        '200':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupWriteResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/StorageFailure' }
  /api/v1/subscribers/{subscriber_id}/groups/{group_id}:
    get:
      summary: Get group
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/GroupIdPath'
      responses:
        '200':
          description: Group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/StorageFailure' }
    put:
      summary: Update group
      description: The response always contains the `config-raw` field, which will be populated only when the updated group changes effective device-side policy, or `null` for no-op changes (such as changing only `name` or `description`).
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/GroupIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupPutRequest'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupWriteResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/StorageFailure' }
    delete:
      summary: Delete group
      description: The response always contains the `config-raw` field. If deleting the group changes the remaining effective parental-control snapshot, `config-raw` contains the updated commands. If no parental-control-owned snapshot remains after the delete, `config-raw` is returned as an empty array `[]`. For no-op changes, it is returned as `null`.
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/GroupIdPath'
      responses:
        '200':
          description: Group deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigRawResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/StorageFailure' }
  /api/v1/subscribers/{subscriber_id}/groups/{group_id}/devices:
    get:
      summary: List devices assigned to a group
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/GroupIdPath'
      responses:
        '200':
          description: Group device assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupDevice'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/StorageFailure' }
    post:
      summary: Add device to group
      description: Assign a device (MAC address) to a group using `client_mac`. One MAC address can belong to only one group per subscriber. Attempting to assign an already-assigned MAC to another group returns a 409 Conflict error. The response always contains the `config-raw` field. `config-raw` contains the updated effective configuration when the policy changes, and contains the current effective configuration for an idempotent assignment when one exists. It is `null` only when no effective configuration applies. An empty array `[]` indicates that the effective policy is cleared.
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/GroupIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupDeviceCreateRequest'
      responses:
        '200':
          description: Device assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDeviceWriteResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/StorageFailure' }
  /api/v1/subscribers/{subscriber_id}/groups/{group_id}/devices/{client_mac}:
    get:
      summary: Get a single device assignment
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/GroupIdPath'
        - $ref: '#/components/parameters/ClientMacPath'
      responses:
        '200':
          description: Device assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDevice'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/StorageFailure' }
    delete:
      summary: Remove device from group
      description: The response always contains the `config-raw` field. If removing the device changes the remaining effective parental-control snapshot, `config-raw` contains the updated commands. If no parental-control-owned snapshot remains after the delete, `config-raw` is returned as an empty array `[]`. For no-op changes, it is returned as `null`.
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/GroupIdPath'
        - $ref: '#/components/parameters/ClientMacPath'
      responses:
        '200':
          description: Device removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigRawResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/StorageFailure' }
  /api/v2/subscribers/{subscriber_id}/groups/{group_id}/devices:
    post:
      summary: Bulk add devices to group
      description: Assign one or more devices (MAC addresses, at most 100) to a group using `client_macs`. One MAC address can belong to only one group per subscriber. Attempting to assign an already-assigned MAC to another group returns a 409 Conflict error and no devices are assigned. The response always contains the `config-raw` field. `config-raw` contains the updated effective configuration when the policy changes, and contains the current effective configuration for an idempotent assignment when one exists. It is `null` only when no effective configuration applies. An empty array `[]` indicates that the effective policy is cleared.
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/GroupIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupDeviceBulkCreateRequest'
      responses:
        '200':
          description: Devices assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDeviceBulkWriteResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/StorageFailure' }
  /api/v1/subscribers/{subscriber_id}/schedules:
    get:
      summary: List schedules
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
      responses:
        '200':
          description: Schedule list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/StorageFailure' }
    post:
      summary: Create schedule
      description: Create a new schedule. Maximum of 20 schedules allowed per subscriber. Exceeding this limit returns a 409 Conflict error. The response always contains the `config-raw` field, which will be `null` for no-op changes or populated if the effective policy state changes. Schedule creation stores schedule data only and does not create active device-side enforcement until the schedule is linked to a group with devices.
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreateRequest'
      responses:
        '200':
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleWriteResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/StorageFailure' }
  /api/v1/subscribers/{subscriber_id}/schedules/{schedule_id}:
    get:
      summary: Get schedule
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/ScheduleIdPath'
      responses:
        '200':
          description: Schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/StorageFailure' }
    put:
      summary: Update schedule
      description: The response always contains the `config-raw` field, which will be populated only when the updated schedule changes effective device-side policy for linked groups with devices, or `null` for no-op changes.
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/ScheduleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePutRequest'
      responses:
        '200':
          description: Schedule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleWriteResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/StorageFailure' }
    delete:
      summary: Delete schedule
      description: The response always contains the `config-raw` field. If deleting the schedule changes the remaining effective parental-control snapshot, `config-raw` contains the updated commands. If no parental-control-owned snapshot remains after the delete, `config-raw` is returned as an empty array `[]`. For no-op changes, it is returned as `null`.
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/ScheduleIdPath'
      responses:
        '200':
          description: Schedule deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigRawResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/StorageFailure' }
  /api/v1/subscribers/{subscriber_id}/schedules/{schedule_id}/groups:
    get:
      summary: List groups associated with a schedule
      description: Returns the groups associated with the specified schedule for the subscriber, ordered by config_index ASC. Includes device_count for each group. Returns an empty array if the schedule exists but has no associated groups.
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/ScheduleIdPath'
      responses:
        '200':
          description: Groups associated with the schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupListItem'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/StorageFailure' }
  /api/v1/subscribers/{subscriber_id}/groups/{group_id}/schedules:
    get:
      summary: List group-schedule links
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/GroupIdPath'
      responses:
        '200':
          description: Group-schedule links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/StorageFailure' }
    post:
      summary: Link schedule to group
      description: The response always contains the `config-raw` field, which will contain the updated commands if the group has devices and the linked schedule is enabled, or `null` for no-op changes.
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/GroupIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupScheduleLinkRequest'
      responses:
        '200':
          description: Schedule linked to group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupScheduleWriteResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/StorageFailure' }
    put:
      summary: Replace schedules linked to group
      description: The response always contains the `config-raw` field, which will contain the updated commands if the replacement changes the effective parental-control snapshot for the group, or `null` for no-op changes.
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/GroupIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupScheduleReplaceRequest'
      responses:
        '200':
          description: Group schedule links replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupScheduleReplaceResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/StorageFailure' }
  /api/v1/subscribers/{subscriber_id}/groups/{group_id}/schedules/{schedule_id}:
    get:
      summary: Get a single group-schedule link
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/GroupIdPath'
        - $ref: '#/components/parameters/ScheduleIdPath'
      responses:
        '200':
          description: Group-schedule link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupScheduleLink'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/StorageFailure' }
    delete:
      summary: Unlink schedule from group
      description: The response always contains the `config-raw` field. If unlinking changes the remaining effective parental-control snapshot, `config-raw` contains the updated commands. If no parental-control-owned snapshot remains after the unlink, `config-raw` is returned as an empty array `[]`. For no-op changes, it is returned as `null`.
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/GroupIdPath'
        - $ref: '#/components/parameters/ScheduleIdPath'
      responses:
        '200':
          description: Group schedule link removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigRawResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/StorageFailure' }

  /api/v1/subscribers/{subscriber_id}/client-access:
    post:
      summary: Pause client internet access
      description: >-
        Create subscriber-scoped client access block for the target MAC address in one of three supported modes:
        (1) **Permanent mode**: provide only `client_mac` and omit all four date/time boundary fields (`start_date`, `stop_date`, `start_time`, `stop_time`). The block remains active indefinitely until removed.
        (2) **Two-field ISO timed mode (preferred)**: provide `client_mac`, `start_date`, and `stop_date` using the canonical 19-character timestamp format `YYYY-MM-DDTHH:MM:SS` interpreted as UTC (no `Z` suffix, no numeric timezone offset, no fractional seconds, and no space separator), and omit `start_time` and `stop_time`. Supports cross-midnight and multi-day windows up to 30 days (`43,200` minutes / `2,592,000` seconds). `stop_date` must be strictly after `start_date` (minimum 1 second), `stop_date - start_date <= 30 days`, and `stop_date` must be strictly in the future relative to current UTC time.
        (3) **Legacy four-field timed mode**: provide `client_mac` along with all four date/time fields (`start_date` as `YYYY-MM-DD`, `stop_date` as `YYYY-MM-DD` equal to the calendar day immediately following `start_date`, `start_time` as `HH:MM:SS`, and `stop_time` as `HH:MM:SS` strictly greater than `start_time`, all interpreted as UTC). This legacy mode is implicitly bounded to `< 24` hours within `start_date` and must not already be expired.
        Mango Parental Control does not perform timezone resolution or conversion; callers (such as Userportal / `owsub`) must convert all windows to UTC before calling this API.
        **Gateway Timezone Requirement:** Because OpenWrt `fw4`/`nftables` rejects timezone suffixes (`Z`/`+00:00`), ignores `utc_time`, and evaluates offset-free `meta time` boundaries using the router OS `/etc/TZ`, the gateway OS timezone (`system.timezone` / `/etc/TZ`) must strictly be configured as `UTC` only for this architecture (while subscriber/venue timezone in `owprov` is used for UI display such as `blocked_until`).
        Omitting a subset of fields, mixing ISO date-time values with date-only or time fields, sending RFC 3339 offsets/fractional seconds, sending explicit `null` or empty strings for any date/time field (including `"start_time": null` or `"stop_time": null` in ISO mode), exceeding the 30-day duration bound, or submitting an already-expired window returns HTTP 400 Bad Request.
        Sending a request for a client MAC that already has an active permanent or timed client-access rule replaces the existing rule parameters in place (any mode can replace any other mode).
        The response always contains the `config-raw` field, which will contain the updated commands if the effective parental-control snapshot changes, or `null` for no-op changes.
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientAccessCreateRequest'
            examples:
              permanent:
                summary: Permanent block (no expiry)
                value:
                  client_mac: "AA:BB:CC:DD:EE:FF"
              isoTimedCrossMidnight:
                summary: Two-field ISO timed block crossing midnight (UTC)
                value:
                  client_mac: "AA:BB:CC:DD:EE:FF"
                  start_date: "2026-11-25T23:00:00"
                  stop_date: "2026-11-26T01:00:00"
              legacyFourFieldTimed:
                summary: Legacy four-field single-day timed block (UTC)
                value:
                  client_mac: "AA:BB:CC:DD:EE:FF"
                  start_date: "2026-11-25"
                  stop_date: "2026-11-26"
                  start_time: "07:30:00"
                  stop_time: "08:00:00"
      responses:
        '200':
          description: Client pause-state created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientAccessWriteResponse'
              examples:
                permanent:
                  summary: Permanent block response
                  value:
                    subscriber_id: "11111111-1111-4111-8111-111111111111"
                    client_mac: "AA:BB:CC:DD:EE:FF"
                    created_at: "2026-11-25T22:55:00Z"
                    updated_at: "2026-11-25T22:55:00Z"
                    config-raw:
                      - ["set", "firewall.pc_client_access_AA_BB_CC_DD_EE_FF", "rule"]
                      - ["set", "firewall.pc_client_access_AA_BB_CC_DD_EE_FF.name", "PC_ClientAccess_AA_BB_CC_DD_EE_FF"]
                      - ["set", "firewall.pc_client_access_AA_BB_CC_DD_EE_FF.enabled", "1"]
                      - ["set", "firewall.pc_client_access_AA_BB_CC_DD_EE_FF.src", "down1v0"]
                      - ["set", "firewall.pc_client_access_AA_BB_CC_DD_EE_FF.dest", "up0v0"]
                      - ["set", "firewall.pc_client_access_AA_BB_CC_DD_EE_FF.family", "any"]
                      - ["set", "firewall.pc_client_access_AA_BB_CC_DD_EE_FF.proto", "all"]
                      - ["set", "firewall.pc_client_access_AA_BB_CC_DD_EE_FF.target", "REJECT"]
                      - ["add_list", "firewall.pc_client_access_AA_BB_CC_DD_EE_FF.src_mac", "AA:BB:CC:DD:EE:FF"]
                isoTimedCrossMidnight:
                  summary: Two-field ISO timed block response (single-rule config-raw)
                  value:
                    subscriber_id: "11111111-1111-4111-8111-111111111111"
                    client_mac: "AA:BB:CC:DD:EE:FF"
