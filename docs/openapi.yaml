  /api/v1/subscribers/{subscriber_id}/client-access/{client_mac}:
    delete:
      summary: Unpause client internet access
      description: >-
        Remove subscriber-scoped client pause-state for the target MAC address.
        The response always contains the `config-raw` field. If removing the
        pause-state changes the remaining effective parental-control snapshot,
        `config-raw` contains the updated commands. If no
        parental-control-owned snapshot remains after the delete, `config-raw`
        is returned as an empty array `[]`. If the pause-state is already
        absent, the operation succeeds and `config-raw` is returned as `null`.
        This API is intended primarily for Userportal / `owsub` orchestration
        and follows the same public/private interface exposure model as the
        existing parental-control APIs.
      parameters:
        - $ref: '#/components/parameters/SubscriberIdPath'
        - $ref: '#/components/parameters/ClientMacPath'
      responses:
        '200':
          description: Client pause-state removed or already absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigRawResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/StorageFailure' }

components:
