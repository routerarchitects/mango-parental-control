          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        schedule_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    GroupScheduleLinkRequest:
      type: object
      additionalProperties: false
      required: [schedule_id]
      properties:
        schedule_id:
          type: string
          format: uuid
    GroupScheduleReplaceRequest:
      type: object
      additionalProperties: false
      required: [schedule_ids]
      properties:
        schedule_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    ConfigRawCommand:
      type: array
      minItems: 2
      maxItems: 3
      description: Ordered config-raw command tuple. Tuple ordering in the response must be deterministic for identical effective subscriber policy state.
      items:
        type: string
    ConfigRawResponse:
      type: object
      required: [config-raw]
      description: Successful write response extension. Write operations return `200 OK`. The `config-raw` property is always present in the response. `config-raw` contains the updated effective configuration when the policy changes, and contains the current effective configuration for an idempotent assignment when one exists. It is `null` only when no effective configuration applies. An empty array `[]` indicates that the effective policy is cleared. Command tuple shape follows the upstream schema reference at `https://github.com/Telecominfraproject/wlan-ucentral-schema/blob/main/schema/config-raw.yml`.
      properties:
        config-raw:
          type: array
          minItems: 0
          nullable: true
          description: Ordered full parental-control command snapshot. This property is always present in the response. `config-raw` contains the updated effective configuration when the policy changes, and contains the current effective configuration for an idempotent assignment when one exists. It is `null` only when no effective configuration applies. An empty array `[]` indicates that the effective policy is cleared. Commands shall be emitted deterministically for identical stored subscriber policy state, with group rendering ordered by `group_config_index`, schedule rendering ordered by `schedule_config_index`, and MAC lists ordered by normalized ascending MAC value.
          items:
            $ref: '#/components/schemas/ConfigRawCommand'
    GroupWriteResponse:
      description: Group write response. Always includes `config-raw` through `ConfigRawResponse` (which is `null` for no-op changes, `[]` when policy is cleared, or the populated array of commands).
      allOf:
        - $ref: '#/components/schemas/ConfigRawResponse'
        - $ref: '#/components/schemas/Group'
    GroupDeviceWriteResponse:
      description: Group-device write response. Always includes `config-raw` through `ConfigRawResponse`. `config-raw` contains the updated effective configuration when the policy changes, and contains the current effective configuration for an idempotent assignment when one exists. It is `null` only when no effective configuration applies. An empty array `[]` indicates that the effective policy is cleared.
      allOf:
        - $ref: '#/components/schemas/ConfigRawResponse'
        - $ref: '#/components/schemas/GroupDevice'
    GroupDeviceBulkWriteResponse:
      description: Bulk group-device write response. Always includes `config-raw` through `ConfigRawResponse`. `config-raw` contains the updated effective configuration when the policy changes, and contains the current effective configuration for an idempotent assignment when one exists. It is `null` only when no effective configuration applies. An empty array `[]` indicates that the effective policy is cleared.
      allOf:
        - $ref: '#/components/schemas/ConfigRawResponse'
        - type: object
          required: [devices]
          properties:
            devices:
              type: array
              items:
                $ref: '#/components/schemas/GroupDevice'
    ScheduleWriteResponse:
      description: Schedule write response. Always includes `config-raw` through `ConfigRawResponse` (which is `null` for no-op changes, `[]` when policy is cleared, or the populated array of commands).
      allOf:
        - $ref: '#/components/schemas/ConfigRawResponse'
        - $ref: '#/components/schemas/Schedule'
    GroupScheduleWriteResponse:
      description: Group-schedule write response. Always includes `config-raw` through `ConfigRawResponse` (which is `null` for no-op changes, `[]` when policy is cleared, or the populated array of commands).
      allOf:
        - $ref: '#/components/schemas/ConfigRawResponse'
        - $ref: '#/components/schemas/GroupScheduleLink'
    GroupScheduleReplaceResponse:
      description: Group-schedule replace response. Always includes `config-raw` through `ConfigRawResponse` (which is `null` for no-op changes, `[]` when policy is cleared, or the populated array of commands).
      allOf:
        - $ref: '#/components/schemas/ConfigRawResponse'
        - type: object
          properties:
            links:
              type: array
              items:
                $ref: '#/components/schemas/GroupScheduleLink'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    ClientAccessState:
      type: object
      required: [subscriber_id, client_mac, created_at, updated_at]
      properties:
        subscriber_id:
          type: string
          format: uuid
        client_mac:
          type: string
          pattern: '^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$'
        start_date:
          description: >-
            UTC enforcement start boundary for timed client-access rules. Omitted for permanent rules.
            Returns canonical `YYYY-MM-DDTHH:MM:SS` (UTC, no timezone suffix) for two-field ISO timed rules,
            or `YYYY-MM-DD` (UTC) for legacy four-field timed rules.
          oneOf:
            - type: string
              pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
              example: "2026-11-25T23:00:00"
            - type: string
              format: date
              pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
              example: "2026-11-25"
        stop_date:
          description: >-
            UTC enforcement stop boundary for timed client-access rules. Omitted for permanent rules.
            Returns canonical `YYYY-MM-DDTHH:MM:SS` (UTC, no timezone suffix) for two-field ISO timed rules,
            or `YYYY-MM-DD` (UTC) for legacy four-field timed rules.
          oneOf:
            - type: string
              pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
              example: "2026-11-26T01:00:00"
            - type: string
              format: date
              pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
              example: "2026-11-26"
        start_time:
          type: string
          pattern: '^([0-1][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
          description: UTC enforcement start time for legacy four-field timed client-access rules. Omitted for permanent rules and two-field ISO timed rules.
        stop_time:
          type: string
          pattern: '^([0-1][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
          description: UTC enforcement stop time for legacy four-field timed client-access rules. Omitted for permanent rules and two-field ISO timed rules.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClientAccessCreateRequest:
      description: >-
        Create request for client-access blocking. Supports three valid shapes:
        (1) permanent block (only `client_mac` provided; all four date/time fields omitted),
        (2) two-field ISO timed block (`client_mac`, `start_date`, and `stop_date` in canonical `YYYY-MM-DDTHH:MM:SS` UTC format; `start_time` and `stop_time` omitted; duration > 0 seconds and <= 30 days / 43,200 minutes), or
        (3) legacy four-field timed block (`client_mac` with `start_date` and `stop_date` as `YYYY-MM-DD`, plus `start_time` and `stop_time` as `HH:MM:SS`).
        Partial boundary fields, mixed ISO/date-only or ISO/time fields, RFC 3339 offsets or fractional seconds, explicit `null` values (including `"start_time": null` or `"stop_time": null` in ISO mode), empty strings, durations exceeding 30 days, or already-expired windows return HTTP 400 Bad Request.
      oneOf:
        - $ref: '#/components/schemas/ClientAccessPermanentCreateRequest'
        - $ref: '#/components/schemas/ClientAccessIsoTimedCreateRequest'
        - $ref: '#/components/schemas/ClientAccessTimedCreateRequest'

    ClientAccessPermanentCreateRequest:
      type: object
      description: Permanent client-access block (indefinite until deleted or replaced). Omit all date/time boundary fields.
      additionalProperties: false
      required: [client_mac]
      properties:
        client_mac:
          type: string
          pattern: '^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$'

    ClientAccessIsoTimedCreateRequest:
      type: object
      description: >-
        Two-field ISO timed client-access request using caller-prepared UTC timestamps.
        Userportal / `owsub` must resolve subscriber or venue timezone context and convert the enforcement window to UTC before calling this API.
        Both `start_date` and `stop_date` must use canonical 19-character `YYYY-MM-DDTHH:MM:SS` interpreted as UTC (no `Z`, no numeric timezone offset, no fractional seconds, no space separator).
        `start_time` and `stop_time` must be omitted (sending them as `null` or `""` is rejected with HTTP 400).
        `stop_date` must be strictly after `start_date` (minimum 1 second), `stop_date - start_date` must not exceed 30 days (`43,200` minutes / `2,592,000` seconds), and `stop_date` must be strictly in the future relative to current UTC time. Supports cross-midnight and multi-day windows up to 30 days.
      additionalProperties: false
      required: [client_mac, start_date, stop_date]
      properties:
        client_mac:
          type: string
          pattern: '^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$'
        start_date:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
          description: Canonical UTC block start timestamp (`YYYY-MM-DDTHH:MM:SS`, no timezone suffix or fractional seconds).
          example: "2026-11-25T23:00:00"
        stop_date:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
          description: Canonical UTC block stop timestamp (`YYYY-MM-DDTHH:MM:SS`, no timezone suffix or fractional seconds). Must be strictly after `start_date`, at most 30 days (`43,200` minutes) after `start_date`, and strictly after current UTC time.
          example: "2026-11-26T01:00:00"

    ClientAccessTimedCreateRequest:
      type: object
      description: >-
        Legacy four-field single-day timed client-access request using a caller-prepared UTC enforcement window.
        Userportal / owsub is responsible for resolving any subscriber or venue
        timezone context and converting the enforcement window to UTC before calling
        this API. Mango Parental Control does not perform timezone resolution or
        conversion. All four date/time boundary fields are interpreted as UTC and
        are compared with the current UTC time for validation, expiration cleanup,
        effective-policy evaluation, and config-raw rendering. Implicitly bounded to < 24 hours within `start_date`.
        Explicit `null` or empty string values are rejected with HTTP 400.
      additionalProperties: false
      required: [client_mac, start_date, stop_date, start_time, stop_time]
      properties:
        client_mac:
          type: string
          pattern: '^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$'
        start_date:
          type: string
          format: date
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
          description: UTC intended block date (`YYYY-MM-DD`) for the legacy single-day timed block.
        stop_date:
          type: string
          format: date
          pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
          description: UTC calendar date (`YYYY-MM-DD`) immediately following `start_date`, required by the legacy four-field timed-block request shape.
        start_time:
          type: string
          pattern: '^([0-1][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
          description: UTC block start time (`HH:MM:SS`) on `start_date`.
        stop_time:
          type: string
          pattern: '^([0-1][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
          description: UTC block stop time (`HH:MM:SS`) on `start_date`. Must be strictly greater than `start_time`.
    ClientAccessWriteResponse:
      description: Client-access write response. Always includes `config-raw` through `ConfigRawResponse` (which is `null` for no-op changes, `[]` when policy is cleared, or the populated array of commands).
      allOf:
        - $ref: '#/components/schemas/ConfigRawResponse'
        - $ref: '#/components/schemas/ClientAccessState'
